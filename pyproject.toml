[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dominian"
version = "1.0.8"
description = "Code intelligence for AI agents — scan codebases, query dependency graphs, detect cycles, find hotspots, analyze impact, and assess refactoring safety."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Dominian Contributors"},
]
keywords = [
    "code-intelligence",
    "dependency-graph",
    "static-analysis",
    "llm",
    "ai-agent",
    "mcp",
    "code-analysis",
    "circular-dependencies",
    "impact-analysis",
    "refactoring",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0",
]
tree-sitter = [
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-typescript>=0.20.0",
    "tree-sitter-java>=0.20.0",
    "tree-sitter-go>=0.20.0",
    "tree-sitter-rust>=0.20.0",
    "tree-sitter-cpp>=0.20.0",
]
communities = [
    "networkx>=3.0",
    "python-louvain>=0.16",
]
all = [
    "mcp>=1.0.0",
    "tree-sitter>=0.20.0",
    "tree-sitter-python>=0.21.0",
    "tree-sitter-javascript>=0.20.0",
    "tree-sitter-typescript>=0.20.0",
    "tree-sitter-java>=0.20.0",
    "tree-sitter-go>=0.20.0",
    "tree-sitter-rust>=0.20.0",
    "tree-sitter-cpp>=0.20.0",
    "networkx>=3.0",
    "python-louvain>=0.16",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
dominian = "dominian.main_new:main"
dominian-mcp = "dominian.server:main"

[project.urls]
Homepage = "https://github.com/yourusername/dominian"
Documentation = "https://github.com/yourusername/dominian#readme"
Repository = "https://github.com/yourusername/dominian"
Issues = "https://github.com/yourusername/dominian/issues"
Changelog = "https://github.com/yourusername/dominian/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["dominian*"]

[tool.setuptools.package-data]
dominian = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
    "B905",  # zip without strict
]

[tool.ruff.lint.isort]
known-first-party = ["dominian"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
